<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Jordy Calderón | Portafolio</title>
  <script>
    (function() {
      var userLang = navigator.language || navigator.userLanguage;
      var targetLocale = 'es';
      if (userLang && userLang.toLowerCase().startsWith('en')) {
        targetLocale = 'en';
      }
      // Redirect to the appropriate subfolder preserving hash
      window.location.replace('./' + targetLocale + '/' + window.location.hash);
    })();
  </script>
</head>
<body>
  <noscript>
    Redirigiendo... / Redirecting...
    <a href="./es/">Español</a> | <a href="./en/">English</a>
  </noscript>
</body>
</html>
